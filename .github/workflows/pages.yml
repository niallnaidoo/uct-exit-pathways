name: Deploy live demo to GitHub Pages

# Builds the browser-only prototype (no backend, synthetic demo data) and
# publishes it to https://niallnaidoo.github.io/uct-exit-pathways/ on every push
# to main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        # A lockfile written on macOS can omit rollup's Linux binary (npm/cli#4828);
        # resolve fresh on the runner.
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund
      - name: Build
        env:
          VITE_BASE: /uct-exit-pathways/
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
